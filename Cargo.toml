[package]
name = "rust_agent"
version = "0.1.0"
edition = "2024"
description = "本地 Ollama(OpenAI 兼容接口) + MCP 工具服务器的极简代码 Agent"
default-run = "rust_agent"

[dependencies]
# 0.42 起默认只开 rustls，chat 相关类型必须显式打开 chat-completion feature
async-openai = { version = "0.42.1", features = ["chat-completion"] }
# 流式对话：自己读 SSE 字节流（async-openai 的流式类型会丢掉 reasoning 字段）
futures-util = "0.3"
# 版本必须与 async-openai 依赖的 reqwest 保持一致，否则类型对不上
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
# client: 作为 MCP 客户端连接子进程
# server: 提供 code-tools-server
# schemars: #[tool] 需要用它生成 inputSchema
# transport-io: 服务端 stdio
# transport-child-process: 客户端拉起子进程并走 stdio
rmcp = { version = "3.5.0", features = [
    "client",
    "macros",
    "schemars",
    "server",
    "transport-child-process",
    "transport-io",
] }
regex = "1.11"
schemars = "1.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# run_command 超时时需要按进程组杀进程（killpg）
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
name = "rust_agent"
path = "src/lib.rs"

[[bin]]
name = "rust_agent"
path = "src/main.rs"

[[bin]]
name = "code-tools-server"
path = "src/bin/code-tools-server.rs"
